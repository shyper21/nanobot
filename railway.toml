[build]
builder = "NIXPACKS"

[deploy]
startCommand = "pip install nanobot-ai -q && mkdir -p ~/.nanobot && python3 -c \"import json,os; cfg={'providers':{'openrouter':{'apiKey':os.environ.get('OPENROUTER_API_KEY','')}}, 'agents':{'defaults':{'provider':'openrouter','model':os.environ.get('NANOBOT_MODEL','deepseek/deepseek-r1:free')}}, 'channels':{'telegram':{'enabled':True,'token':os.environ.get('TELEGRAM_BOT_TOKEN',''),'allowFrom':[os.environ.get('TELEGRAM_USER_ID','')]}}}; open(os.path.expanduser('~/.nanobot/config.json'),'w').write(json.dumps(cfg))\" && python3 -m nanobot gateway"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
